<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentoring status</title>
<link rel="stylesheet" href="_ds/new-design-system-093b667a-136f-4587-b18b-a9af51b17538/tokens/fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
  /* Colours from packages/ui/src/styles/theme.css on origin/master */
  :root{
    --primary:#ff5d18;--primary-400:#ff9a5c;--primary-500:#ff8b45;--primary-50:#ffe8d9;--sidebar-active:#ffefe8;
    --gray-50:#f9f9f9;--gray-200:#e8e8e8;--gray-400:#c4c4c4;--gray-500:#8d8d8d;--gray-950:#0a0a0a;
    --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;--slate-500:#64748b;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --tg-200:#e5e7eb;--tg-500:#6b7280;--tg-700:#374151;--tg-900:#111827;
    --border:#e5e7eb;--muted:#f3f4f6;--muted-fg:#6b7280;--destructive:#ff4e45;
    --cal-orange-50:#ffefe8;--cal-orange-200:#ffb495;--cal-orange-400:#ff7d46;--cal-orange-500:#ff5d18;
    --cal-yellow-50:#fff5d9;--cal-yellow-500:#eab308;--cal-yellow-600:#eec032;
    --cal-blue-50:#e7f0fe;--cal-blue-500:#1068f4;--cal-blue-600:#3982f6;
    --kpi:#ff7a1a;--star:#ff8133;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100vh;overflow:hidden;background:var(--gray-50);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;color:var(--tg-900);-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;}
  a{color:inherit;}
  .app{display:flex;height:100vh;}

  /* Sidebar (ShellSidebar) */
  aside{width:320px;flex-shrink:0;background:#fff;border-right:1px solid #eeeef0;display:flex;flex-direction:column;color:#1c1d1c;}
  .sb-head{display:flex;align-items:center;gap:8px;padding:18px 14px 2px;}
  .sb-head img{height:36px;width:auto;}
  .sb-collapse{margin-left:auto;border:0;background:none;border-radius:6px;padding:6px;color:rgba(28,29,28,.4);display:inline-flex;cursor:pointer;}
  .sb-collapse:hover{background:#f4f4f5;}
  .sb-nav{flex:1;display:flex;flex-direction:column;gap:14px;padding:14px 14px 8px;overflow-y:auto;}
  .grp{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px 8px 10px;border:0;background:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;}
  .grp:hover{background:#f4f4f5;}
  .grp .ico{color:rgba(28,29,28,.55);display:inline-flex;}
  .grp .chev{margin-left:auto;color:rgba(28,29,28,.35);display:inline-flex;transition:transform .15s;}
  .grp.closed .chev{transform:rotate(-90deg);}
  .navlink{display:block;width:100%;margin-top:2px;padding:6px 10px 6px 36px;border:0;background:none;border-radius:6px;font-size:13px;color:rgba(28,29,28,.75);cursor:pointer;text-align:left;}
  .navlink:hover{background:#f4f4f5;}
  .navlink.on{background:var(--sidebar-active);color:var(--primary);font-weight:600;}
  .sb-foot{position:relative;border-top:1px solid #eeeef0;padding:14px;}
  .userbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 38px 8px 8px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;}
  .userbtn:hover{background:#f4f4f5;}
  .userbtn b{display:block;font-size:13px;line-height:16px;font-weight:500;}
  .userbtn small{display:block;font-size:11px;line-height:16px;color:var(--muted-fg);}
  .bell{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#1c1d1c;}
  .bell:hover{background:#f4f4f5;}
  .bell i{position:absolute;top:-2px;right:-2px;min-width:16px;padding:2px 4px;border-radius:99px;background:var(--destructive);color:#fff;font-size:10px;font-weight:600;font-style:normal;line-height:1;box-shadow:0 0 0 2px #fff;}
  .menu{position:absolute;bottom:calc(100% - 4px);left:14px;right:14px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:30;}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;border:0;background:none;cursor:pointer;font-size:13px;text-align:left;}
  .menu-item:hover{background:#f4f4f5;}
  .menu-sep{height:1px;background:var(--border);margin:4px 0;}
  .menu-status{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;text-align:left;font-size:13px;color:var(--tg-500);}
  .menu-status:hover{background:var(--gray-50);}
  .menu-status .e{font-size:17px;width:22px;text-align:center;}

  /* Avatars */
  .av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--muted);color:var(--muted-fg);font-weight:500;flex-shrink:0;}
  .av-ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;}
  .av-ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .av-mood{position:absolute;right:-4px;bottom:-3px;width:46%;height:46%;min-width:17px;min-height:17px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--border);display:inline-flex;align-items:center;justify-content:center;line-height:1;}
  .av-ok{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:#22c55e;border:2px solid #fff;color:#fff;display:inline-flex;align-items:center;justify-content:center;}

  /* Main + header (ShellPageHeader) */
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .page-head{min-height:80px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;}
  .page-head h1{margin:0;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;}
  .tile{width:40px;height:40px;border-radius:39%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
  .scroll{flex:1;overflow-y:auto;}
  .frame{max-width:1280px;margin:0 auto;padding:32px 32px 120px;display:flex;flex-direction:column;gap:16px;}

  /* Shared blocks */
  .card2{background:#fff;border:1px solid var(--slate-200);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .block{background:#fff;padding:24px;}
  .block h2{margin:0 0 20px;font-size:16px;font-weight:600;color:var(--tg-900);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 1px 1px rgba(0,0,0,.1);}
  .btn:hover{background:var(--gray-50);}
  .btn.join{background:var(--cal-orange-500);border-color:var(--cal-orange-500);color:#fff;box-shadow:none;border-radius:6px;padding:0 16px;}
  .btn.join:hover{filter:brightness(.95);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:none;}
  .btn.primary:hover{filter:brightness(.95);}
  .btn.ghost{border-color:transparent;box-shadow:none;background:none;}
  .btn.ghost:hover{background:var(--gray-50);}
  .btn.sm{height:30px;padding:0 10px;font-size:13px;}
  .btn.danger{color:#e3342f;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .link{color:var(--primary);font-weight:500;cursor:pointer;background:none;border:0;padding:0;font-size:13px;}
  .link:hover{text-decoration:underline;}
  .muted{color:var(--muted-fg);}

  /* Mood chip (counterpart status, opens the status popover) */
  .mood{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 6px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:400;color:var(--tg-700);cursor:pointer;white-space:nowrap;max-width:260px;vertical-align:middle;}
  .mood:hover{border-color:var(--primary-400);background:var(--sidebar-active);}
  .mood .e{font-size:14px;line-height:1;}
  .mood span{overflow:hidden;text-overflow:ellipsis;}
  .mood.icon{padding:0 5px;}

  /* Micro endorsements */
  .endos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .endos.stack{flex-direction:column;align-items:center;margin-top:16px;width:160px;}
  .endo{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 8px;border-radius:999px;border:1px solid #fde68a;background:#fffbeb;color:#92400e;font-size:12px;font-weight:500;white-space:nowrap;}
  .endo .e{font-size:13px;line-height:1;}
  .endo{max-width:300px;}
  .endo .lbl-t{overflow:hidden;text-overflow:ellipsis;}
  .endos.stack .endo{max-width:200px;}
  .xp-note{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--tg-500);}
  .xp-note b{color:#047857;}
  .xp-earned{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:28px;padding:0 12px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:13px;font-weight:600;}
  .xp-earned.muted-pill{background:var(--muted);color:var(--muted-fg);font-weight:500;}
  .lvlup{text-align:center;}
  .lvlup .big{font-size:44px;line-height:1;}
  .lvlup h3{margin-top:10px !important;font-size:22px !important;}
  .endo.add{cursor:pointer;border-style:dashed;border-color:var(--slate-300);background:#fff;color:var(--slate-500);padding:0 10px;}
  .endo.add:hover{border-color:var(--primary-400);color:var(--primary);}

  /* Compact crumbs (sub-pages) */
  .crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted-fg);}
  .crumbs .tile{width:28px;height:28px;}
  .crumbs a{cursor:pointer;}
  .crumbs a:hover{color:var(--tg-900);text-decoration:underline;}
  .crumbs b{color:var(--tg-900);font-weight:600;}
  .back{align-self:flex-start;border:0;background:none;padding:0;font-size:14px;color:var(--tg-700);cursor:pointer;}
  .back:hover{text-decoration:underline;}

  /* "How are you today?" */
  .checkin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 24px;}
  .checkin h2{margin:0 0 2px;font-size:16px;font-weight:600;}
  .checkin p{margin:0;font-size:13px;color:var(--slate-500);}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .qbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--slate-200);background:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s;}
  .qbtn:hover{transform:translateY(-2px);border-color:var(--primary-400);background:var(--sidebar-active);}
  .qbtn.more{font-size:13px;font-weight:500;color:var(--slate-500);width:auto;padding:0 12px;}
  .mine{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
  .mine .big{width:48px;height:48px;border-radius:14px;background:var(--sidebar-active);display:inline-flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}

  /* MenteeOverviewCard */
  .hero{padding:24px;}
  .who{display:flex;align-items:center;gap:28px;}
  .who h2{margin:0;font-size:20px;font-weight:600;color:var(--slate-900);}
  .role-badge{display:inline-block;margin-top:4px;border:1px solid var(--slate-300);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;color:var(--slate-700);}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;margin-top:22px;align-items:center;}
  .kpi-l{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);white-space:nowrap;}
  .kpi-l svg{color:var(--slate-400);flex-shrink:0;}
  .kpi-v{margin-top:10px;font-size:24px;line-height:1;font-weight:600;color:var(--kpi);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .kpi-v a{cursor:pointer;text-decoration:none;}
  .kpi-v a:hover{text-decoration:underline;}
  .body2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--slate-200);}
  .body2 > section{padding:24px;}
  .body2 > section + section{border-left:1px solid var(--slate-200);}
  .body2 h3{margin:0 0 16px;font-size:14px;font-weight:600;color:var(--slate-900);}
  dl.info{display:grid;grid-template-columns:auto 1fr;gap:12px 12px;margin:0;font-size:14px;}
  dl.info dt{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--slate-500);white-space:nowrap;}
  dl.info dt svg{color:var(--slate-400);}
  dl.info dd{margin:0;color:var(--slate-900);min-width:0;overflow-wrap:anywhere;}
  .tag{display:inline-block;border:1px solid var(--slate-200);background:var(--slate-100);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;}
  .prog-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:14px;}
  dl.prog{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px;}
  dl.prog dt{color:var(--slate-500);}
  dl.prog dd{margin:0;}

  /* Upcoming event card (upcoming-event-card.svelte) */
  .events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .ev{border:2px solid var(--gray-200);border-radius:12px;background:#fff;padding:12px;}
  .ev-row{display:flex;align-items:center;gap:12px;}
  .dtile{width:100px;height:100px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;background:var(--cal-blue-50);color:var(--cal-blue-500);}
  .dtile b{font-size:36px;line-height:1;font-weight:600;}
  .dtile span{font-size:20px;line-height:1;text-transform:uppercase;}
  .ev-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .ev-l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tchip{padding:4px 8px;font-size:12px;border-radius:4px;background:var(--cal-blue-50);color:var(--cal-blue-500);}
  .ev-time{font-size:14px;color:var(--muted-fg);}
  .dur{border:1px solid var(--gray-400);background:#fff;border-radius:4px;padding:2px 6px;font-size:12px;color:var(--tg-700);}
  .ev-l2{display:flex;gap:8px;flex-wrap:wrap;}
  .att{display:flex;align-items:center;gap:10px;border-radius:8px;background:var(--gray-50);padding:6px 10px 6px 8px;font-size:14px;}
  .att small{font-size:12px;color:var(--gray-500);}
  .ev-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .opener{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff7ed;font-size:13px;color:var(--tg-700);}
  .opener .e{font-size:18px;line-height:1;}
  .opener q{font-weight:500;color:var(--tg-900);}
  .empty{border:2px solid var(--gray-200);border-radius:12px;padding:24px;text-align:center;font-size:14px;color:var(--gray-500);}
  .past .ev{opacity:.6;}
  .sec-toggle{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;display:inline-flex;align-items:center;gap:6px;}
  .sec-toggle .chev{display:inline-flex;color:var(--muted-fg);transition:transform .15s;}
  .sec-toggle.closed .chev{transform:rotate(-90deg);}
  .sec-h{display:flex;align-items:center;gap:6px;margin:0 0 20px;font-size:16px;font-weight:600;}

  /* MentorInfo */
  .mentor-info{display:flex;gap:48px;align-items:flex-start;}
  .mentor-info h3{margin:0;font-size:24px;line-height:28px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mentor-info dl{margin:16px 0 0;display:flex;flex-direction:column;gap:8px;font-size:15px;}
  .mentor-info dt{font-weight:500;display:inline;}
  .mentor-info dd{display:inline;margin:0;}

  /* WelcomeCard */
  .welcome{display:flex;gap:8px;padding:24px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .welcome .left{display:flex;flex-direction:column;gap:24px;flex:1;}
  .welcome .hi{display:flex;align-items:center;gap:12px;}
  .welcome .hi small{display:block;font-size:14px;color:var(--tg-500);}
  .welcome .hi b{display:block;font-size:30px;font-weight:300;line-height:1.2;}
  .wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
  .wgrid .lbl{font-size:14px;color:var(--tg-500);margin-bottom:6px;}
  .wline{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px;}
  .wline b{font-weight:600;}
  .wline span{color:var(--tg-500);}
  .rating{display:flex;flex-direction:column;gap:8px;}
  .stars{display:flex;align-items:center;gap:12px;font-size:14px;}
  .stars i{color:var(--star);font-style:normal;font-size:20px;letter-spacing:6px;}
  .bar-l{font-size:12px;color:var(--tg-500);}
  .bar{display:flex;align-items:center;gap:10px;font-size:12px;}
  .bar span{display:block;width:192px;height:8px;border-radius:99px;background:var(--tg-200);overflow:hidden;}
  .bar span i{display:block;height:100%;background:#e8590c;border-radius:99px;}
  .alert-chem{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:8px;background:#ffedd5;color:#e8590c;font-size:16px;line-height:1.5;}
  .alert-chem a{text-decoration:underline;font-weight:600;cursor:pointer;}
  .alert-chem button{margin-left:auto;border:0;background:none;color:inherit;cursor:pointer;display:inline-flex;padding:2px;}

  /* SchedulingCalendar */
  .cal{display:flex;flex-direction:column;gap:16px;}
  .cal-tb{display:flex;align-items:center;gap:8px;}
  .ibtn{width:36px;height:36px;border:1px solid var(--gray-200);background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .ibtn:hover{background:var(--gray-50);}
  .cal-month{font-size:16px;font-weight:600;color:var(--gray-950);margin:0 4px;}
  .today-btn{height:32px;padding:0 14px;font-size:13px;border:1px solid var(--gray-200);background:#fff;border-radius:8px;cursor:pointer;}
  .tabs{margin-left:auto;display:flex;background:var(--muted);border-radius:8px;padding:3px;height:36px;}
  .tabs button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:14px;font-weight:500;color:var(--muted-fg);cursor:pointer;}
  .tabs button.on{background:#fff;color:var(--tg-900);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .legend{display:flex;align-items:center;gap:16px;font-size:14px;flex-wrap:wrap;}
  .legend b{font-weight:600;}
  .sw{display:inline-flex;align-items:center;gap:8px;}
  .sw i{width:20px;height:20px;border-radius:4px;border:1px solid;display:inline-block;}
  .split{margin-left:auto;display:flex;height:36px;border-radius:6px;background:var(--primary);color:#fff;overflow:hidden;}
  .split button{border:0;background:none;color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .split button:first-child{padding:0 10px;}
  .split button:last-child{padding:0 8px;border-left:1px solid rgba(255,255,255,.2);}
  .wk{border:1px solid var(--tg-200);border-radius:8px;overflow:hidden;}
  .wk-head{display:grid;grid-template-columns:64px repeat(7,1fr);border-bottom:1px solid var(--tg-200);}
  .wk-head div{text-align:center;padding:10px 0;font-size:12px;color:var(--tg-500);text-transform:uppercase;}
  .wk-head div b{display:flex;align-items:center;justify-content:center;margin:6px auto 0;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:500;color:var(--tg-700);}
  .wk-head div.today{color:var(--primary);font-weight:600;}
  .wk-head div.today b{background:var(--primary);color:#fff;}
  .wk-body{display:grid;grid-template-columns:64px repeat(7,1fr);height:520px;overflow-y:auto;position:relative;}
  .wk-hours div{height:52px;font-size:11px;color:var(--tg-500);text-align:right;padding-right:8px;transform:translateY(-6px);}
  .wk-col{position:relative;border-left:1px solid var(--tg-200);background:repeating-linear-gradient(to bottom,transparent 0,transparent 51px,var(--tg-200) 51px,var(--tg-200) 52px);}
  .cev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:12px;line-height:16px;display:flex;gap:6px;overflow:hidden;}
  .cev.avail{font-weight:500;color:var(--gray-950);}
  .cev.avail i{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .cev.booked{background:var(--cal-blue-600);color:#fff;cursor:default;}
  .cev.booked .bar-w{width:2px;align-self:stretch;background:rgba(255,255,255,.9);border-radius:2px;flex-shrink:0;}
  .cev.booked b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cev .tb{display:inline-block;margin-top:3px;border-radius:4px;background:rgba(255,255,255,.9);color:var(--cal-blue-600);padding:0 4px;font-size:10px;text-transform:uppercase;}
  .cev .emo{cursor:pointer;border:0;background:rgba(255,255,255,.95);border-radius:99px;font-size:12px;line-height:1;padding:2px 4px;margin-left:2px;}

  /* MyMentees table */
  .tbl{border:1px solid var(--tg-200);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden;}
  .tbl-tb{border-bottom:1px solid var(--tg-200);padding:12px 24px;}
  .seg{display:inline-flex;border:.5px solid #ccc;border-radius:8px;overflow:hidden;}
  .seg button{border:0;background:#fff;font-size:13px;font-weight:500;padding:5px 12px;color:#6b7280;cursor:pointer;}
  .seg button + button{border-left:.5px solid #ccc;}
  .seg button.on{background:#ff8b45;color:#fff;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead{background:var(--gray-50);}
  th{padding:12px 16px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--tg-700);}
  td{padding:12px 16px;border-top:1px solid var(--tg-200);color:var(--tg-900);}
  .nm{display:flex;align-items:center;gap:16px;}
  .name-link{cursor:pointer;text-decoration:none;}
  .name-link:hover{color:var(--primary);text-decoration:underline;}

  /* Library stories (cards follow Pack; the player keeps PackTales' comic look) */
  .story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .story-card{display:flex;flex-direction:column;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden;background:#fff;}
  .story-cover{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%;background:#f6f0e6;}
  .story-card.soon .story-cover{filter:grayscale(.35);opacity:.8;}
  .story-body{display:flex;flex-direction:column;gap:6px;padding:16px;flex:1;}
  .story-eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--primary);}
  .story-body h3{margin:0;font-size:16px;font-weight:600;}
  .story-body p{margin:0;font-size:13.5px;color:var(--tg-500);line-height:1.45;}
  .story-for{font-size:12.5px;color:var(--tg-700);background:var(--gray-50);border-radius:6px;padding:6px 8px;}
  .story-foot{margin-top:auto;padding-top:10px;}
  .pill-soon{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:var(--muted);color:var(--muted-fg);font-size:12.5px;font-weight:500;}

  .tl-intro{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:40px;align-items:center;background:#fff;border:1px solid var(--slate-200);border-radius:16px;padding:32px;}
  .tl-intro-cover{width:100%;aspect-ratio:864/1184;object-fit:cover;border:2.5px solid #0e0e0e;border-radius:6px;transform:rotate(-.6deg);}
  .tl-intro-body{display:flex;flex-direction:column;gap:12px;max-width:620px;}
  .tl-intro-body h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;}
  .tl-blurb{margin:0;font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:24px;line-height:1.3;}
  .tl-preview{margin:0;font-size:13px;color:#9a3412;background:#fff7ed;border-radius:8px;padding:8px 10px;}
  /* Report language picker: toolbar button (34px, 13px, pack-gray-325 border) + dropdown */
  .tl-lang-wrap{position:relative;}
  .tl-bar-end{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .tl-lang-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;color:#3b3b3b;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);white-space:nowrap;}
  .tl-lang-btn:hover,.tl-lang-btn[aria-expanded="true"]{background:#f9f9f9;}
  .tl-lang-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:160px;padding:4px;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.08);}
  .tl-lang-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:4px;background:none;font-size:14px;color:var(--tg-900);text-align:left;cursor:pointer;}
  .tl-lang-item:hover,.tl-lang-item:focus{background:#ffe8d9;outline:none;}
  .tl-lang-check{margin-left:auto;display:inline-flex;}

  .tl-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;margin:-32px -32px 0;padding:14px 32px;background:rgba(249,249,249,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);font-size:14px;}
  .tl-progress{flex:1;max-width:320px;height:8px;border-radius:99px;background:var(--tg-200);overflow:hidden;}
  .tl-progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s;}
  .tl-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:stretch;padding-top:8px;}
  .tl-panel.uniform{display:flex;flex-direction:column;scroll-margin-top:84px;}
  .tl-panel.uniform .tl-band{min-height:236px;}
  .tl-panel.uniform .tl-caption{min-height:72px;margin-top:auto;}
  .tl-caption.empty{background:#fff;}
  .tl-new-row{grid-column-start:1;}
  .tl-panel{margin:0;background:#fff;border:2.5px solid #0e0e0e;border-radius:4px;overflow:hidden;transform:rotate(-.25deg);}
  .tl-panel:nth-child(even){transform:rotate(.25deg);}
  .tl-panel img{display:block;width:100%;aspect-ratio:1184/864;object-fit:cover;}
  .tl-band{display:flex;flex-direction:column;gap:12px;padding:14px 14px 6px;background:#fbf7f1;}
  .tl-caption{padding:10px 14px;border-top:2.5px solid #0e0e0e;background:#ffe8d9;font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:19px;line-height:1.3;}
  .tl-bubble{position:relative;max-width:82%;padding:9px 14px;border:2px solid #0e0e0e;border-radius:18px;background:#fff;font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:20px;line-height:1.25;}
  .tl-bubble p{margin:0;}
  .tl-name{display:block;font:600 10px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6b6560;}
  .tl-bubble::after{content:"";position:absolute;bottom:-10px;width:16px;height:16px;background:#fff;border-right:2px solid #0e0e0e;border-bottom:2px solid #0e0e0e;}
  .tl-left{align-self:flex-start;}
  .tl-left::after{left:22px;transform:rotate(45deg) skew(10deg,10deg);}
  .tl-right{align-self:flex-end;background:#ffe8d9;}
  .tl-right::after{right:22px;background:#ffe8d9;transform:rotate(45deg) skew(10deg,10deg);}
  .tl-thought{border-style:dashed;border-radius:24px;}
  .tl-thought::after{width:10px;height:10px;bottom:-14px;border:2px dashed #0e0e0e;border-radius:50%;transform:none;}
  .tl-choice{grid-column:1/-1;padding:22px;border:2.5px solid #0e0e0e;border-radius:14px;background:#fff;box-shadow:5px 5px 0 var(--primary);scroll-margin-top:80px;}
  .tl-prompt{margin:0 0 14px;font-weight:700;font-size:18px;}
  .tl-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .tl-option{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1.5px solid #e7ded2;border-radius:10px;background:#f6f0e6;font:400 15px/1.45 Inter,sans-serif;text-align:left;cursor:pointer;color:#0e0e0e;}
  .tl-option:hover{border-color:var(--primary);background:#ffe8d9;}
  .tl-letter{flex:none;display:grid;place-items:center;width:26px;height:26px;border:1.5px solid #0e0e0e;border-radius:50%;font-weight:700;font-size:12px;}
  .tl-ending{grid-column:1/-1;display:flex;flex-direction:column;gap:24px;scroll-margin-top:80px;}
  .tl-end-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start;}
  .tl-end-side{display:flex;flex-direction:column;gap:14px;}
  .tl-end-side h2{margin:0;font-size:26px;}
  .tl-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);}
  .tl-meters{display:grid;gap:8px;max-width:420px;}
  .tl-meter{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:10px;font-weight:600;font-size:13px;}
  .tl-track{height:10px;border:1.5px solid #0e0e0e;border-radius:999px;background:#fff;overflow:hidden;}
  .tl-track i{display:block;height:100%;background:var(--primary);}
  .tl-card{background:#fff;border:1px solid var(--slate-200);border-radius:14px;padding:20px;}
  .tl-takeaways{margin:0;padding-left:18px;font-size:14px;line-height:1.6;}
  .tl-path{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .tl-path li{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--gray-50);}
  .tl-path p{margin:0;}
  .tl-path-q{font-size:12px;color:var(--muted-fg);}
  .tl-path-a{font-weight:600;font-size:14px;margin:6px 0 !important;}
  .tl-path-n{font-size:13px;color:var(--tg-700);}
  .tl-path-s{font-size:11.5px;color:var(--gray-500);margin-top:8px !important;}
  .tl-q{margin:6px 0 10px;font-weight:600;}
  .tl-reflect textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit;font-size:14px;resize:vertical;outline:0;}
  .tl-reflect textarea:focus{border-color:var(--primary-400);}
  .tl-answer{margin:0;padding:10px 12px;border-radius:8px;background:var(--gray-50);font-size:14px;}
  .tl-session{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:10px;background:#ecfdf5;}
  .tl-session b{display:block;font-size:14px;color:#047857;}
  .tl-session span:not(.av){font-size:13px;color:var(--tg-700);}
  .tl-agenda{margin-top:10px;padding:10px 12px;border:1px dashed var(--slate-300);border-radius:10px;font-size:13.5px;}
  .tl-agenda p{margin:4px 0 0;}
  .ev-agenda{display:flex;align-items:flex-start;gap:10px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--cal-blue-50);font-size:13px;color:var(--tg-700);}
  .ev-agenda .e{font-size:16px;line-height:1.2;}
  @media (max-width: 1100px){ .tl-options,.tl-path{grid-template-columns:1fr;} }
  @media (max-width: 900px){ .tl-intro,.tl-strip,.tl-end-top{grid-template-columns:1fr;} .tl-bar{margin:-32px -16px 0;padding:12px 16px;} }

  /* Profile frames (rings around avatars) + level hover */
  .fr{position:relative;display:inline-flex;border-radius:50%;flex-shrink:0;}
  .fr-img{position:absolute;left:-14%;top:-14%;width:128%;height:128%;pointer-events:none;z-index:1;}
  .av-mood,.av-ok{z-index:2;}
  [data-level]{position:relative;}
  [data-level]:hover::after{content:attr(data-level);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:#18181b;color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;z-index:20;pointer-events:none;}

  /* Preferences › Appearance */
  .edit-appear{margin-left:auto;align-self:center;flex-shrink:0;}
  .pref-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);}
  .pref-tabs button{border:0;background:none;padding:10px 14px;font-size:14px;font-weight:500;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .pref-tabs button.on{color:var(--primary);border-bottom-color:var(--primary);}
  .appear{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;}
  .appear-main{display:flex;flex-direction:column;gap:16px;}
  .appear-hero{display:flex;align-items:center;gap:24px;padding:24px;}
  .lvl-line{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;flex-wrap:wrap;}
  .lvl-pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--sidebar-active);color:var(--primary);font-size:13px;font-weight:700;}
  .xp-bar{height:10px;border-radius:99px;background:var(--tg-200);overflow:hidden;margin-top:10px;max-width:520px;}
  .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9b4d,#ff5d18);border-radius:99px;}
  .frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .frame-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 12px 14px;border:1.5px solid var(--slate-200);border-radius:12px;background:#fff;cursor:pointer;text-align:center;}
  .frame-card.on{border-color:var(--primary);background:var(--sidebar-active);}
  .frame-card.locked .frame-prev{filter:grayscale(.6);opacity:.6;}
  .frame-prev{display:flex;align-items:center;justify-content:center;height:92px;}
  .frame-prev.big{height:auto;}
  .frame-only{width:82px;height:82px;display:block;}
  .frame-empty{width:64px;height:64px;border-radius:50%;border:1.5px dashed var(--slate-300);}
  .frame-name{font-size:14px;font-weight:600;margin-top:6px;}
  .frame-sub{font-size:12px;color:var(--muted-fg);min-height:16px;}
  .frame-foot{margin-top:8px;min-height:30px;display:flex;align-items:center;}
  .eq-badge{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12.5px;font-weight:600;}
  .lock-badge{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:999px;background:var(--muted);color:var(--muted-fg);font-size:12.5px;font-weight:500;}
  .appear-side{display:flex;flex-direction:column;gap:16px;}
  .appear-side .block{padding:20px;}
  .appear-side h2{margin-bottom:14px;}
  .rule{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:14px;}
  .rule:first-of-type{border-top:0;padding-top:0;}
  .xp-amt{flex-shrink:0;min-width:48px;font-weight:700;color:#047857;font-size:13.5px;}
  .xp-amt.neg{color:var(--tg-500);}
  .xp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;}
  .xp-row:first-of-type{border-top:0;padding-top:0;}
  @media (max-width: 1100px){ .appear{grid-template-columns:1fr;} }

  /* Path drops */
  .drop-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border);}
  .block h2 + .drop-row{border-top:0;padding-top:0;}
  .drop-icon{width:40px;height:40px;border-radius:10px;background:var(--gray-50);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .drop-main{flex:1;min-width:0;}
  .drop-main b{font-size:14.5px;font-weight:600;}
  .drop-type{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);margin-bottom:2px;}
  .drop-xp{font-size:13px;font-weight:700;color:#047857;flex-shrink:0;}
  .drop-act{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:96px;justify-content:flex-end;}
  .fact-reveal{margin-top:8px;padding:10px 12px;border-radius:8px;background:#fffbeb;font-size:14px;color:var(--tg-700);}
  .quiz-q{margin:6px 0 14px;font-size:17px;font-weight:600;}
  .quiz-opts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:14.5px;cursor:pointer;}
  .quiz-opt:hover:not([disabled]){border-color:var(--primary-400);background:var(--sidebar-active);}
  .quiz-opt[disabled]{cursor:default;}
  .quiz-opt.right{border-color:#22c55e;background:#ecfdf5;color:#047857;font-weight:600;}
  .quiz-opt.wrong{border-color:#f87171;background:#fef2f2;color:#b91c1c;}
  .quiz-opt.dim{opacity:.55;}
  .quiz-why{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13.5px;}
  .quiz-why.ok{background:#ecfdf5;color:#065f46;}
  .quiz-why.no{background:#fef2f2;color:#991b1b;}

  /* Achievements (badge art: ../../badges, earned / -locked / -disabled) */
  .ach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .ach{position:relative;outline:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:4px 2px 6px;border-radius:12px;background:#fff;}
  .ach img{width:92px;height:92px;display:block;}
  .ach b{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.25;}
  .ach-lvl{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#ffe8d9;color:#c2410c;font-size:11px;font-weight:600;margin-top:2px;}
  .ach-locked .ach-lvl,.ach-disabled .ach-lvl{background:var(--muted);color:var(--muted-fg);}
  .ach-tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:190px;display:none;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:#18181b;color:#fff;text-align:left;z-index:30;box-shadow:0 10px 25px rgba(0,0,0,.25);}
  .ach-tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#18181b;}
  .ach-tip b{font-size:13px;margin:0;}
  .ach-tip span{font-size:12px;color:#d4d4d8;}
  .ach-tip .ach-tip-lvl{color:#fdba74;font-weight:600;}
  .ach:hover .ach-tip,.ach:focus .ach-tip{display:flex;}

  /* Popover */
  .pop{position:fixed;z-index:60;width:320px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.14);padding:16px;}
  .pop-h{display:flex;align-items:flex-start;gap:10px;}
  .pop-h .e{font-size:28px;line-height:1;}
  .pop-h b{font-size:14.5px;font-weight:600;display:block;}
  .iconbtn{border:0;background:none;cursor:pointer;color:var(--tg-500);padding:4px;border-radius:6px;display:inline-flex;}
  .iconbtn:hover{background:rgba(0,0,0,.05);color:var(--tg-900);}

  /* Set a status modal (Slack-style single field) */
  .overlay{position:fixed;inset:0;background:rgba(15,15,20,.4);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;}
  .modal{width:520px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.2);padding:22px 24px 20px;}
  .modal h3{margin:0;font-size:20px;font-weight:700;}
  .sfield{position:relative;display:flex;align-items:center;margin-top:18px;border:1px solid #c7c7cc;border-radius:8px;height:44px;}
  .sfield:focus-within{border-color:#1d9bd1;box-shadow:0 0 0 3px rgba(29,155,209,.25);}
  .sfield .emoji-btn{width:44px;height:42px;border:0;background:none;border-radius:8px 0 0 8px;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tg-500);flex-shrink:0;}
  .sfield .emoji-btn:hover{background:var(--gray-50);}
  .sfield input{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:0 4px;min-width:0;background:none;}
  .sfield input::placeholder{color:#9ca3af;}
  .sfield .clear{margin-right:8px;}
  .sfield .count{margin-right:12px;font-size:12px;color:var(--gray-500);flex-shrink:0;}
  .picker{position:absolute;top:calc(100% + 6px);left:0;z-index:5;width:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);}
  .picker button{border:0;background:none;font-size:20px;height:36px;border-radius:6px;cursor:pointer;}
  .picker button:hover{background:var(--gray-50);}
  .lbl{font-size:14px;font-weight:600;margin:18px 0 6px;}
  select{width:100%;height:40px;border:1px solid #c7c7cc;border-radius:8px;padding:0 10px;font:inherit;font-size:14px;background:#fff;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}

  /* Chat (chat2.0 floating widget) */
  .fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--primary-400);color:#fff;border:0;box-shadow:0 10px 15px -3px rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:40;}

      + '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (c * pct) + " " + c + '" transform="rotate(-90 48 48)"/></svg>'
      + '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--slate-800);">' + done + "/" + total + "</span></div>";

  // ---------- Achievements (mentee card, 3rd column) ----------
  // Each badge has levels: the count needed for Level 1, 2, 3… (more can be appended later).
  const ACH_DEFS = [
    { icon: "rocket", name: "Kickoff", badge: "kickoff", desc: "Sessions done", metric: "sessions", levels: [1, 5, 10, 25, 50] },
    { icon: "target", name: "Goal Setter", badge: "goal-setter", desc: "Goals done", metric: "goals", levels: [3, 10, 25] },
    { icon: "flag", name: "Halfway there", badge: "halfway-there", desc: "Programs where you reached halfway", metric: "halfway", levels: [1, 3, 5] },
    { icon: "flame", name: "On a Roll", badge: "on-a-roll", desc: "Best run of sessions in a row", metric: "streak", levels: [5, 10, 20] },
    { icon: "chat", name: "Feedback Seeker", badge: "feedback-seeker", desc: "Session feedbacks given", metric: "feedbacks", levels: [3, 10, 25] },
    { icon: "book", name: "Storyteller", badge: "storyteller", desc: "Stories finished", metric: "stories", levels: [1, 5, 10] },
    { icon: "heart", name: "Encourager", badge: "encourager", desc: "Endorsements given", metric: "endorse", levels: [3, 15, 50] },
    { icon: "trophy", name: "Path complete", badge: "path-complete", desc: "Paths completed", metric: "paths", levels: [1, 3, 5] },
  ];
  // Counts the prototype doesn't track elsewhere.
  const ACH_COUNTS = {
    debora: { goals: 4, halfway: 0, feedbacks: 2, bestStreak: 5, paths: 0 },
    giulia: { goals: 2, halfway: 1, feedbacks: 4, bestStreak: 3, paths: 0 },
    luca: { goals: 1, halfway: 0, feedbacks: 0, bestStreak: 1, paths: 0 },
  };
  function achCount(pid, metric) {
    const c = ACH_COUNTS[pid];
    if (metric === "sessions") return MENTEE_INFO[pid].done;
    if (metric === "streak") return Math.max(c.bestStreak, S.streak[pid] || 0);
    if (metric === "stories") return xpOf(pid).talesDone.length;
    if (metric === "endorse") return S.endorsements.filter((e) => e.from === pid).length;
    return c[metric];
  }
  function achievementsFor(pid) {
    return ACH_DEFS.map((d) => {
      const count = achCount(pid, d.metric);

  // ---------- XP, levels and profile frames (per account; Pack-wide, no HR settings) ----------
  const LEVEL_XP = [0, 100, 300, 600, 1000, 1400, 1900, 2500]; // total XP needed for Level 1..8
  const XP_RULES = [
    { xp: 50, label: "Session done", detail: "Counts once attendance is confirmed. Not for chemistry sessions, check-ins or no-shows." },
    { xp: 100, label: "5 sessions in a row", detail: "For mentees. Only your own reschedule or cancel restarts the count." },

  ];
  // Frames: the team's SVGs in ../../frames. Free, earned by a rule, or unlocked with XP from a level.
  const FRAMES_ROOT = "../../frames/";
  const FRAMES = [
    { key: "silver-plate", name: "Silver plate", level: 1, price: 0 },
    { key: "silver-cog", name: "Silver cog", level: 2, price: 100 },
    { key: "silver-compass", name: "Silver compass", level: 2, price: 100 },
    { key: "silver-studded", name: "Silver studded", level: 3, price: 200 },
    { key: "silver-tech", name: "Silver tech", level: 3, price: 200 },
    { key: "silver-shard", name: "Silver shard", level: 4, price: 250 },
    { key: "gold-scalloped", name: "Gold scalloped", level: 1, earned: "Earned with 5 sessions in a row" },
    { key: "gold-braided", name: "Gold braided", level: 5, price: 300 },
    { key: "gold-lobed", name: "Gold lobed", level: 5, price: 300 },
    { key: "gold-ruby", name: "Gold ruby", level: 6, price: 350 },
    { key: "gold-sapphire", name: "Gold sapphire", level: 7, price: 450 },
    { key: "gold-vine", name: "Gold vine", level: 7, price: 450 },
  ];
  const FRAME = Object.fromEntries(FRAMES.map((f) => [f.key, f]));
  const levelOf = (total) => LEVEL_XP.reduce((lvl, need, i) => (total >= need ? i + 1 : lvl), 1);
  const xpOf = (pid) => S.xp[pid];

  const weekOf = (d) => Math.floor(d / 7);
  const endorseXpLeft = (pid) => ENDORSE_XP_PER_WEEK - S.endorsements.filter((e) => e.from === pid && e.xp && weekOf(e.day) === weekOf(S.day)).length;
  // Adds to both total (level) and balance (spendable); a crossed threshold queues the level-up moment.
  function gainXp(pid, amount, label, day) {
    const acc = xpOf(pid);
    const before = levelOf(acc.total);
    acc.total += amount;
    acc.balance += amount;
    acc.history.push({ day: day == null ? S.day : day, xp: amount, label });
    const after = levelOf(acc.total);
    if (after > before) S.levelUps[pid] = after;
  }
  function taleXpPill() {
    if (isTalePreview()) return '<span class="xp-earned muted-pill">Previews don\'t earn XP</span>';
    const run = taleRun();
    return run.xpRunId === run.runId ? '<span class="xp-earned">+' + XP.tale + " XP earned</span>" : '<span class="xp-earned muted-pill">XP already earned for this story</span>';
  }
  function xpModal() {
    if (!U.xpModal) return "";
    const m = U.xpModal;
    return '<div class="overlay"><div class="modal lvlup" role="dialog" aria-label="' + esc(m.title) + '" style="width:400px;"><div class="big">+' + m.xp + ' XP</div><h3>' + esc(m.title) + "</h3>"

  }
  function levelUpModal() {
    const lvl = S.levelUps[S.viewAs];
    if (!lvl || U.modal || U.endorse || U.unlock || U.xpModal || U.trivia) return "";
    const fresh = FRAMES.filter((f) => f.level === lvl && f.price);
    return '<div class="overlay"><div class="modal lvlup" role="dialog" aria-label="Level up" style="width:400px;"><div class="big">🎉</div><h3>You reached Level ' + lvl + "</h3>"
      + '<p class="muted" style="margin:6px 0 0;">' + (fresh.length ? "New frame" + (fresh.length > 1 ? "s" : "") + " you can unlock: " + fresh.map((f) => "<b>" + esc(f.name) + "</b> · " + f.price + " XP").join(", ") : "Keep going for new frames.") + "</p>"
      + '<div class="modal-actions" style="justify-content:center;"><button class="btn" data-act="closeLevelUp">Later</button><button class="btn primary" data-act="levelUpFrames">See frames</button></div></div></div>';
  }
  function sessionChangeModal() {
    if (!U.sessionChange) return "";
    const { id, kind } = U.sessionChange;
    const sess = SESSIONS.find((x) => x.id === id);
    const streak = S.streak[sess.mentee] || 0;
    const isReschedule = kind === "reschedule";
    const warn = !isMentor() && streak > 0
      ? '<div class="xp-note" style="background:#fff7ed;border-radius:8px;padding:10px 12px;color:#9a3412;">🔥 This restarts your ' + streak + "-session streak. " + (STREAK_EVERY - (streak % STREAK_EVERY)) + " more in a row would earn +" + XP.streak + " XP.</div>"
      : "";
    return '<div class="overlay" data-act="closeSessionChangeBg"><div class="modal" role="dialog" style="width:440px;"><div style="display:flex;align-items:center;justify-content:space-between;"><h3>' + (isReschedule ? "Reschedule" : "Cancel") + ' this session?</h3><button class="iconbtn" data-act="closeSessionChange">' + I.xL + "</button></div>"
      + '<p class="muted" style="margin:10px 0 0;font-size:14px;">Session with ' + esc(PEOPLE[otherIn(sess, S.viewAs)].full) + " · " + dayLabel(sess.day) + (isReschedule ? " → " + dayLabel(sess.day + 7) : "") + "</p>" + warn
      + '<div class="modal-actions"><button class="btn" data-act="closeSessionChange">Keep session</button><button class="btn ' + (isReschedule ? "primary" : "danger") + '" data-act="confirmSessionChange">' + (isReschedule ? "Reschedule" : "Cancel session") + "</button></div></div></div>";
  }

  // ---------- Path drops: a fixed set every Monday, by the mentee's path; undone drops go at week end ----------
  const TRIVIA = {
    "trivia-1": { title: "Innovation basics", questions: [
      { q: "What does “MVP” stand for in product work?", options: ["Minimum viable product", "Most valuable player", "Maximum value proposition"], answer: 0, why: "The smallest version of an idea that lets you learn from real users." },
      { q: "In design thinking, which phase comes first?", options: ["Prototype", "Empathise", "Test"], answer: 1, why: "You start by understanding the people you're designing for." },
      { q: "“Fail fast” mainly means…", options: ["Give up quickly", "Ship without testing", "Learn cheaply before investing more"], answer: 2, why: "Small, early experiments are cheaper than big late failures." },
    ] },
    "trivia-2": { title: "Ideas that stuck", questions: [
      { q: "Post-it notes came from an experiment with…", options: ["A weak glue", "A printing error", "A paper shortage"], answer: 0, why: "3M's Spencer Silver made a glue that barely stuck; a colleague later used it for bookmarks." },
      { q: "What is a “pre-mortem”?", options: ["A review after launch", "Imagining the project failed and asking why", "A risk score in a spreadsheet"], answer: 1, why: "Picturing failure up front surfaces risks people otherwise keep quiet about." },
      { q: "Which rule helps brainstorming most?", options: ["Judge each idea right away", "Aim for one perfect idea", "Go for quantity, judge later"], answer: 2, why: "Separating idea generation from evaluation leads to more and better options." },
    ] },
  };
  const FUN_FACTS = {
    "fact-1": { teaser: "Where did Gmail come from?", fact: "Gmail started as a side project in Google's “20% time”, when engineers could spend a fifth of their week on their own ideas." },
    "fact-2": { teaser: "What did the first webcam watch?", fact: "A coffee pot. In 1991, Cambridge researchers pointed a camera at it so nobody walked to an empty pot." },
  };
  // Week index (0 = week of Mon 19 Oct) → that week's drops.
  const WEEKLY_DROPS = {
    0: [{ type: "trivia", ref: "trivia-1" }, { type: "fact", ref: "fact-1" }, { type: "story", ref: "feedback" }],
    1: [{ type: "trivia", ref: "trivia-2" }, { type: "fact", ref: "fact-2" }],
  };
  const DROP_META = {
    trivia: { icon: "🧠", label: "Trivia", time: "1 min" },
    fact: { icon: "💡", label: "Fun fact", time: "10 sec" },
    story: { icon: "📖", label: "Story pill", time: "4 min" },
  };
  const dropKey = (drop) => "w" + weekOf(S.day) + "-" + drop.type + "-" + drop.ref;
  const isDropDone = (drop) => !!S.drops.done[dropKey(drop)];

  function dropsCard() {
    const drops = WEEKLY_DROPS[weekOf(S.day)];
    if (isMentor() || !drops || !drops.length) return "";
    const rows = drops.map((d) => {
      const m = DROP_META[d.type];
      const done = isDropDone(d);
      const title = d.type === "trivia" ? TRIVIA[d.ref].title : d.type === "fact" ? FUN_FACTS[d.ref].teaser : TALES ? TALES.story.title.en : "Story";
      const xp = d.type === "trivia" ? '<span class="drop-xp">+' + XP.trivia + " XP</span>" : d.type === "story" ? '<span class="drop-xp">+' + XP.tale + " XP</span>" : "";
      let action;
      if (done && d.type === "trivia") action = '<span class="eq-badge">' + I.check + 'Done</span><button class="btn sm ghost" data-act="openTrivia" data-ref="' + d.ref + '">Replay</button>';
      else if (done) action = '<span class="eq-badge">' + I.check + "Done</span>";
      else if (d.type === "trivia") action = '<button class="btn sm" data-act="openTrivia" data-ref="' + d.ref + '">Start</button>';
      else if (d.type === "fact") action = '<button class="btn sm" data-act="revealFact" data-ref="' + d.ref + '">Reveal</button>';
      else action = '<button class="btn sm" data-act="openStory">Open</button>';
      const reveal = d.type === "fact" && done ? '<div class="fact-reveal">' + esc(FUN_FACTS[d.ref].fact) + "</div>" : "";
      return '<div class="drop-row"><span class="drop-icon">' + m.icon + '</span><div class="drop-main"><div class="drop-type">' + m.label + " · " + m.time + '</div><b>' + esc(title) + "</b>" + reveal + "</div>" + xp + '<div class="drop-act">' + action + "</div></div>";
    }).join("");
    return '<div class="block"><h2>This week · ' + esc(MENTEE_INFO[S.viewAs].path) + "</h2>" + rows + "</div>";
  }

  function triviaModal() {
    if (!U.trivia) return "";
    const t = TRIVIA[U.trivia.ref];
    const i = U.trivia.idx;
    const q = t.questions[i];
    const picked = U.trivia.answers[i];
    const isAnswered = picked != null;
    const isLast = i === t.questions.length - 1;
    const opts = q.options.map((o, k) => {
      const cls = !isAnswered ? "" : k === q.answer ? " right" : k === picked ? " wrong" : " dim";
      return '<button class="quiz-opt' + cls + '" data-act="answerTrivia" data-k="' + k + '"' + (isAnswered ? " disabled" : "") + ">" + esc(o) + "</button>";
    }).join("");
    return '<div class="overlay" data-act="closeTriviaBg"><div class="modal" role="dialog" aria-label="Trivia" style="width:520px;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;"><div><div class="drop-type">🧠 Trivia · ' + esc(MENTEE_INFO[S.viewAs].path) + "</div><h3>" + esc(t.title) + '</h3></div><button class="iconbtn" data-act="closeTrivia">' + I.xL + "</button></div>"
      + '<div class="muted" style="font-size:12.5px;margin-top:14px;">Question ' + (i + 1) + " of " + t.questions.length + '</div><p class="quiz-q">' + esc(q.q) + '</p><div class="quiz-opts">' + opts + "</div>"
      + (isAnswered ? '<div class="quiz-why ' + (picked === q.answer ? "ok" : "no") + '"><b>' + (picked === q.answer ? "Correct." : "Not quite.") + "</b> " + esc(q.why) + "</div>" : "")
      + '<div class="modal-actions">' + (isAnswered ? '<button class="btn primary" data-act="' + (isLast ? "finishTrivia" : "nextTrivia") + '">' + (isLast ? "Finish" : "Next") + "</button>" : "") + "</div></div></div>";
  }

  function appearancePage() {
    const acc = xpOf(S.viewAs);
    const lvl = levelOf(acc.total);
    const next = LEVEL_XP[lvl];
    const floor = LEVEL_XP[lvl - 1];
    const pct = next ? Math.round(((acc.total - floor) / (next - floor)) * 100) : 100;
    const sel = U.appearanceSel || acc.equipped || "none";
    const owned = (key) => acc.frames.includes(key);
    // frameOnly: show the frame art alone (no profile picture), used in "Your frames".
    const card = (f, frameOnly) => {
      const isOwned = f.key === "none" || owned(f.key);
      const isEquipped = (acc.equipped || "none") === f.key;
      const levelLocked = f.level > lvl;
      let foot;
      if (isEquipped) foot = '<span class="eq-badge">' + I.check + "Equipped</span>";
      else if (isOwned) foot = '<button class="btn sm" data-act="equipFrame" data-key="' + f.key + '">Equip</button>';
      else if (levelLocked) foot = '<span class="lock-badge">🔒 Level ' + f.level + "</span>";
      else foot = '<button class="btn sm" data-act="askUnlock" data-key="' + f.key + '">Unlock · ' + f.price + " XP</button>";
      const sub = f.key === "none" ? "Plain avatar" : f.earned && isOwned ? f.earned : isOwned ? "Owned" : levelLocked ? f.price + " XP" : "Available";
      return '<div class="frame-card' + (sel === f.key ? " on" : "") + (levelLocked && !isOwned ? " locked" : "") + '" data-act="previewFrame" data-key="' + f.key + '">'
        + '<div class="frame-prev">' + (!frameOnly ? avatar(S.viewAs, 64, { frame: f.key, noLevel: true }) : f.key === "none" ? '<span class="frame-empty"></span>' : '<img class="frame-only" src="' + FRAMES_ROOT + f.key + '.svg" alt="">') + "</div>"
        + '<div class="frame-name">' + esc(f.name) + '</div><div class="frame-sub">' + esc(sub) + '</div><div class="frame-foot">' + foot + "</div></div>";
    };
    const ownedFrames = [{ key: "none", name: "No frame", level: 1 }].concat(FRAMES.filter((f) => owned(f.key)));
    const moreFrames = FRAMES.filter((f) => !owned(f.key));
    const history = acc.history.slice().reverse().map((h) => '<div class="xp-row"><span class="xp-amt ' + (h.xp < 0 ? "neg" : "") + '">' + (h.xp > 0 ? "+" : "") + h.xp + '</span><span style="flex:1;">' + esc(h.label) + '</span><span class="muted">' + dayLabel(h.day) + "</span></div>").join("");
    const selName = sel === "none" ? "No frame" : FRAME[sel].name;
    const selAction = sel === (acc.equipped || "none") ? '<span class="eq-badge">' + I.check + "Equipped</span>"
      : sel === "none" || owned(sel) ? '<button class="btn primary sm" data-act="equipFrame" data-key="' + sel + '">Equip ' + esc(selName) + "</button>" : "";
    return '<div class="pref-tabs"><button data-act="prefSoon">Profile</button><button data-act="prefSoon">Notifications</button><button class="on">Appearance</button></div>'
      + '<div class="appear"><div class="appear-main">'
      + '<div class="card2 appear-hero"><div class="frame-prev big">' + avatar(S.viewAs, 96, { frame: sel, noLevel: true }) + "</div>"
      + '<div style="flex:1;min-width:0;"><div class="muted" style="font-size:13px;">Previewing: <b style="color:var(--tg-900);">' + esc(selName) + "</b></div>"
      + '<div class="lvl-line"><span class="lvl-pill">Level ' + lvl + "</span><b>" + acc.total.toLocaleString("en-US") + ' XP</b><span class="muted">' + (next ? (next - acc.total) + " XP to Level " + (lvl + 1) : "Top level") + "</span></div>"
      + '<div class="xp-bar"><i style="width:' + pct + '%;"></i></div></div>'
      + '<div style="align-self:flex-start;">' + selAction + "</div></div>"
      + '<div class="block"><h2>Your frames (' + (ownedFrames.length - 1) + ')</h2><div class="frame-grid">' + ownedFrames.map((f) => card(f, true)).join("") + "</div></div>"
      + '<div class="block"><h2>More frames</h2><div class="frame-grid">' + moreFrames.map((f) => card(f)).join("") + "</div></div></div>"
      + '<div class="appear-side"><div class="block"><h2>How to earn XP</h2>' + XP_RULES.map((r) => '<div class="rule"><span class="xp-amt">+' + r.xp + '</span><div><b>' + esc(r.label) + '</b><div class="muted" style="font-size:12.5px;">' + esc(r.detail) + "</div></div></div>").join("") + "</div>"
      + '<div class="block"><h2>XP history</h2>' + history + "</div></div></div>";
  }

  function unlockModal() {
    if (!U.unlock) return "";
    const f = FRAME[U.unlock];
    const acc = xpOf(S.viewAs);
    const after = acc.balance - f.price;
    return '<div class="overlay" data-act="closeUnlockBg"><div class="modal" role="dialog" aria-label="Unlock frame" style="width:420px;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;"><h3>Unlock ' + esc(f.name) + ' frame</h3><button class="iconbtn" data-act="closeUnlock">' + I.xL + "</button></div>"
      + '<div style="display:flex;align-items:center;gap:16px;margin-top:18px;">' + avatar(S.viewAs, 64, { frame: f.key, noLevel: true })
      + '<div style="font-size:14px;line-height:1.6;">Costs <b>' + f.price + " XP</b><br>Balance after: <b>" + after + ' XP</b><br><span class="muted">Your level stays the same.</span></div></div>'
      + '<div class="modal-actions"><button class="btn" data-act="closeUnlock">Cancel</button><button class="btn primary" data-act="unlockFrame"' + (after < 0 ? " disabled" : "") + ">Unlock</button></div></div></div>";
  }

  function render() {
    syncSessions();
    const pages = { overview: () => (isMentor() ? mentorOverview() : menteeOverview()), events: eventsPage, library: libraryPage, chemistry: chemistryPage, menteeProfile: menteeProfilePage, story: storyPage, appearance: appearancePage };
    const chatScroll = document.getElementById("chat-body");
    const wasAtBottom = !chatScroll || chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 40;
    const focused = document.activeElement && document.activeElement.id ? { id: document.activeElement.id, at: document.activeElement.selectionStart } : null;
    const scroller = document.querySelector(".scroll");
    const scrollTop = scroller ? scroller.scrollTop : 0;
    document.getElementById("root").innerHTML = '<div class="app">' + sidebar() + "<main>" + pageHead() + '<div class="scroll"><div class="frame">' + (pages[S.page] || pages.overview)() + "</div></div></main></div>"
      + popover() + statusModal() + endorseModal() + unlockModal() + sessionChangeModal() + triviaModal() + xpModal() + levelUpModal() + chat() + demoBar() + (U.toast ? '<div class="toast">' + I.info + esc(U.toast) + "</div>" : "");
    const newScroller = document.querySelector(".scroll");
    if (newScroller) newScroller.scrollTop = scrollTop;
    const cb = document.getElementById("chat-body");
    if (cb && wasAtBottom) cb.scrollTop = cb.scrollHeight;
    // A toast closing re-renders mid-typing, so put the caret back.
    const refocus = focused && document.getElementById(focused.id);
    if (refocus) { refocus.focus(); if (focused.at != null && refocus.setSelectionRange) refocus.setSelectionRange(focused.at, focused.at); }
  }

  // ---------- Actions ----------
  let toastTimer;
  const toast = (text) => { U.toast = text; clearTimeout(toastTimer); toastTimer = setTimeout(() => { U.toast = ""; render(); }, 2800); };
  const commit = () => { save(); render(); };
  const resetChat = () => ({ open: false, with: null, draft: "" });

  const openModal = (emoji) => {
    const cur = statusOf(S.viewAs);
    U.modal = emoji
      ? { emoji, text: "", expiry: "today", picker: false }
      : cur ? { emoji: cur.emoji, text: cur.text, expiry: cur.expiry, picker: false } : { emoji: "", text: "", expiry: "today", picker: false };
    U.userMenu = false;
    render();
    setTimeout(() => { const el = document.getElementById("st-text"); if (el) el.focus(); }, 0);
  };

  const send = () => {
    const pid = U.chat.with;
    const text = U.chat.draft.trim();
    if (!pid || !text) return;
    const key = threadKey(pid, S.viewAs);
    S.threads[key] = (S.threads[key] || []).concat([{ from: S.viewAs, text, day: S.day }]);
    U.chat.draft = "";
    commit();
  };

  const ACTIONS = {
    nav: (el) => { S.page = el.dataset.page; S.profileId = null; U.pop = null; commit(); const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0; },
    openProfile: (el) => { S.page = "menteeProfile"; S.profileId = el.dataset.pid; U.pop = null; commit(); const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0; },
    openEndorse: (el) => {
      U.endorse = { to: el.dataset.pid, emoji: DEFAULT_ENDORSE_EMOJI, text: "", picker: false };
      U.pop = null;
      render();
      setTimeout(() => { const i = document.getElementById("en-text"); if (i) i.focus(); }, 0);
    },
    closeEndorse: () => { U.endorse = null; render(); },
    closeEndorseBg: (el, ev) => { if (ev.target === el) { U.endorse = null; render(); } },
    toggleEndoPicker: () => { U.endorse.picker = !U.endorse.picker; render(); },
    pickEndoEmoji: (el) => { Object.assign(U.endorse, { emoji: el.dataset.e, picker: false }); render(); setTimeout(() => { const i = document.getElementById("en-text"); if (i) i.focus(); }, 0); },
    saveEndorse: () => {
      const { to, emoji } = U.endorse;
      const label = U.endorse.text.trim();
      if (label.length < ENDORSE_MIN_CHARS) return;
      const xp = endorseXpLeft(S.viewAs) > 0 ? XP.endorse : 0;
      S.endorsements.push({ to, emoji, label, from: S.viewAs, day: S.day, xp });
      if (xp) gainXp(S.viewAs, xp, "Endorsed " + PEOPLE[to].full);
      U.endorse = null;
      toast(xp ? "+" + xp + " XP · You endorsed " + PEOPLE[to].first : "You endorsed " + PEOPLE[to].first + ". No XP: this week's " + ENDORSE_XP_PER_WEEK + " are used.");
      commit();
    },
    togglePast: () => { U.pastOpen = !U.pastOpen; render(); },
    askSessionChange: (el) => { U.sessionChange = { id: el.dataset.id, kind: el.dataset.kind }; render(); },
    closeSessionChange: () => { U.sessionChange = null; render(); },
    closeSessionChangeBg: (el, ev) => { if (ev.target === el) { U.sessionChange = null; render(); } },
    confirmSessionChange: () => {
      const { id, kind } = U.sessionChange;
      const sess = SESSIONS.find((x) => x.id === id);
      const byMentee = !isMentor();
      if (kind === "reschedule") S.sessionDays[id] = sess.day + 7;
      else S.cancelled.push(id);
      if (byMentee) S.streak[sess.mentee] = 0;
      U.sessionChange = null;
      toast((kind === "reschedule" ? "Session moved to " + dayLabel(sess.day + 7) + "." : "Session cancelled.") + (byMentee ? " Your streak restarted." : ""));
      commit();
    },
    closeXpModal: () => { U.xpModal = null; render(); },
    openTrivia: (el) => { U.trivia = { ref: el.dataset.ref, idx: 0, answers: [] }; render(); },
    closeTrivia: () => { U.trivia = null; render(); },
    closeTriviaBg: (el, ev) => { if (ev.target === el) { U.trivia = null; render(); } },
    answerTrivia: (el) => { U.trivia.answers[U.trivia.idx] = Number(el.dataset.k); render(); },
    nextTrivia: () => { U.trivia.idx += 1; render(); },
    finishTrivia: () => {
      const { ref, answers } = U.trivia;
      const t = TRIVIA[ref];
      const right = t.questions.filter((q, i) => answers[i] === q.answer).length;
      const drop = (WEEKLY_DROPS[weekOf(S.day)] || []).find((d) => d.type === "trivia" && d.ref === ref);
      if (drop) S.drops.done[dropKey(drop)] = true;
      U.trivia = null;
      // +5 XP once per trivia; replays earn nothing.
      if (!S.drops.triviaXp.includes(ref)) {
        S.drops.triviaXp.push(ref);
        gainXp(S.viewAs, XP.trivia, "Trivia · " + t.title);
        U.xpModal = { xp: XP.trivia, title: "Trivia done", sub: right + " of " + t.questions.length + " correct" };
      }
      commit();
    },
    revealFact: (el) => {
      const drop = (WEEKLY_DROPS[weekOf(S.day)] || []).find((d) => d.type === "fact" && d.ref === el.dataset.ref);
      if (drop) S.drops.done[dropKey(drop)] = true;
      commit();
    },
    closeLevelUp: () => { delete S.levelUps[S.viewAs]; commit(); },
    levelUpFrames: () => { delete S.levelUps[S.viewAs]; S.page = "appearance"; U.appearanceSel = null; commit(); const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0; },
    openAppearance: () => {
      S.page = "appearance";
      Object.assign(U, { appearanceSel: null, userMenu: false, pop: null });
      commit();
      const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
    },
    previewFrame: (el) => { U.appearanceSel = el.dataset.key; render(); },
    equipFrame: (el) => {
      const key = el.dataset.key;
      xpOf(S.viewAs).equipped = key === "none" ? null : key;
      U.appearanceSel = key;
      toast(key === "none" ? "Frame removed." : FRAME[key].name + " frame equipped.");
      commit();
    },
    askUnlock: (el) => { U.unlock = el.dataset.key; render(); },
    closeUnlock: () => { U.unlock = null; render(); },
    closeUnlockBg: (el, ev) => { if (ev.target === el) { U.unlock = null; render(); } },
    unlockFrame: () => {
      const f = FRAME[U.unlock];
      const acc = xpOf(S.viewAs);
      if (acc.balance < f.price) return;
      acc.balance -= f.price;
      acc.frames.push(f.key);
      acc.history.push({ day: S.day, xp: -f.price, label: "Unlocked " + f.name + " frame" });
      U.unlock = null;
      U.appearanceSel = f.key;
      toast(f.name + " frame unlocked.");
      commit();
    },
    prefSoon: () => { toast("Not part of this prototype."); render(); },
    openStory: () => {
      S.page = "story";
      if (isTalePreview()) U.taleRun = { started: false, choices: {}, reflection: "", lang: U.taleRun.lang, runId: 0 };
      U.pop = null;
      commit();
      const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
    },
    taleStart: () => { taleRun().started = true; commit(); const sc = document.querySelector(".scroll"); if (sc) sc.scrollTop = 0; },
    taleChoose: (el) => {
      const run = taleRun();
      run.choices[el.dataset.beat] = el.dataset.opt;
      const isFinished = taleChoices().every((b) => run.choices[b.id]);
      const acc = xpOf(S.viewAs);
      // XP only for a mentee's first finish of each story; previews and replays earn nothing.
      const storyDrop = (WEEKLY_DROPS[weekOf(S.day)] || []).find((d) => d.type === "story" && d.ref === TALES.story.id);
      if (isFinished && !isTalePreview() && storyDrop) S.drops.done[dropKey(storyDrop)] = true;
      if (isFinished && !isTalePreview() && !acc.talesDone.includes(TALES.story.id)) {
        acc.talesDone.push(TALES.story.id);
        run.xpRunId = run.runId;
        gainXp(S.viewAs, XP.tale, "Finished “" + TALES.story.title.en + "”");
        U.xpModal = { xp: XP.tale, title: "Story finished", sub: TALES.story.title.en };
      }
      commit();
      // Land on the reaction that replaced the choice, not at the bottom.
      const target = document.getElementById("tl-r-" + el.dataset.beat);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    },
    taleRestart: () => {
      const run = taleRun();
      Object.assign(run, { started: true, choices: {}, reflection: "", runId: run.runId + 1 });
      commit();
      const sc = document.querySelector(".scroll"); if (sc) sc.scrollTo({ top: 0, behavior: "smooth" });
    },
    toggleTaleLang: () => { U.taleLangOpen = !U.taleLangOpen; render(); },
    taleLang: (el) => { taleRun().lang = el.dataset.lang; U.taleLangOpen = false; commit(); },
    taleShare: () => {
      const next = upcomingSessions(S.viewAs)[0];
      if (!next) return;
      const run = S.tale;
      S.taleShared = { runId: run.runId, sessionId: next.id, when: dayLabel(next.day) + " · " + next.time.split(" ")[0], path: talePath(), endingTitle: taleEnding().title.en, reflection: run.reflection.trim() };
      commit();
      const box = document.getElementById("tl-session"); if (box) box.scrollIntoView({ behavior: "smooth", block: "center" });
    },
    toggleNav: () => { U.navOpen = !U.navOpen; render(); },
    userMenu: () => { U.userMenu = !U.userMenu; render(); },
    openStatus: () => openModal(null),
    quick: (el) => openModal(el.dataset.e),
    closeModal: () => { U.modal = null; render(); },
    closeModalBg: (el, ev) => { if (ev.target === el) { U.modal = null; render(); } },
    togglePicker: () => { U.modal.picker = !U.modal.picker; render(); },
    pickEmoji: (el) => { Object.assign(U.modal, { emoji: el.dataset.e, picker: false }); render(); setTimeout(() => { const i = document.getElementById("st-text"); if (i) i.focus(); }, 0); },
    resetField: () => { Object.assign(U.modal, { emoji: "", text: "", picker: false }); render(); },
    saveStatus: () => {
      const d = U.modal;
      const text = d.text.trim();
      if (!d.emoji && !text) return;
      const emoji = d.emoji || DEFAULT_EMOJI;
      S.statuses[S.viewAs] = { emoji, text, expiry: d.expiry, setDay: S.day, expiresDay: expiresDayFor(d.expiry, S.viewAs) };
      U.modal = null;
      toast("Status updated.");
      commit();
    },
    clearStatus: () => { delete S.statuses[S.viewAs]; U.modal = null; U.userMenu = false; toast("Status cleared."); commit(); },
    pop: (el) => {
      const r = el.getBoundingClientRect();
      U.pop = U.pop && U.pop.pid === el.dataset.pid ? null : { pid: el.dataset.pid, x: r.left, y: r.bottom + 8 };
      render();
    },
    closePop: () => { U.pop = null; render(); },
    toggleChat: () => { U.chat = U.chat.open ? resetChat() : Object.assign(resetChat(), { open: true }); U.pop = null; render(); },
    openChat: (el) => { U.chat = { open: true, with: el.dataset.pid, draft: "" }; S.unread[threadKey(el.dataset.pid, S.viewAs)] = 0; U.pop = null; commit(); },
    chatBack: () => { U.chat = Object.assign(resetChat(), { open: true }); render(); },
    send,
    scrollMentor: () => { const el = document.getElementById("my-mentor"); if (el) el.scrollIntoView({ behavior: "smooth" }); },
    hideChem: () => { S.hideChemAlert = true; commit(); },
    week: (el) => { const dir = Number(el.dataset.dir); S.weekOffset = dir === 0 ? Math.floor(S.day / 7) : S.weekOffset + dir; commit(); },
    menteesTab: (el) => { U.menteesTab = el.dataset.tab; render(); },
    viewAs: (el) => {
      S.viewAs = el.dataset.pid;
      if ((S.page === "chemistry" || S.page === "menteeProfile") && !isMentor()) { S.page = "overview"; S.profileId = null; }
      if (S.page === "story") S.page = "library";
      Object.assign(U, { userMenu: false, pop: null, modal: null, endorse: null, chat: resetChat() });
      toast("You're now using Pack as " + me().role);
      commit();
    },
    nextDay: () => {
      S.day += 1;
      S.weekOffset = Math.floor(S.day / 7);
      U.pop = null;
      // Rule-based endorsements land once their session is over.
      const newlyEarned = AUTO_AWARDS.filter((a) => {
        const sess = SESSIONS.find((x) => x.id === a.sessionId);
        return !S.cancelled.includes(sess.id) && sess.day < S.day && !S.endorsements.some((e) => e.to === a.to && e.key === a.key);
      });
      newlyEarned.forEach((a) => S.endorsements.push(earned(a.to, a.key, S.day)));
      // Sessions that ended yesterday count as done (attendance confirmed in this demo).
      const mine = [];
      activeSessions().filter((x) => x.day === S.day - 1).forEach((x) => {
        gainXp(x.mentee, XP.session, "Session with " + PEOPLE[x.mentor].full, x.day);
        gainXp(x.mentor, XP.session, "Session with " + PEOPLE[x.mentee].full, x.day);
        if (S.viewAs === x.mentee || S.viewAs === x.mentor) mine.push("+" + XP.session + " XP · Session with " + PEOPLE[otherIn(x, S.viewAs)].first);
        S.streak[x.mentee] = (S.streak[x.mentee] || 0) + 1;
        if (S.streak[x.mentee] % STREAK_EVERY === 0) {
          gainXp(x.mentee, XP.streak, S.streak[x.mentee] + " sessions in a row", x.day);
          if (S.viewAs === x.mentee) mine.push("+" + XP.streak + " XP · " + S.streak[x.mentee] + " in a row 🔥");
        }
      });
      toast("It's now " + dayLabel(S.day) + "." + (mine.length ? " " + mine.join(" · ") : "") + (newlyEarned.length ? " New endorsements: " + newlyEarned.map((a) => PEOPLE[a.to].first + " " + EARNED[a.key].emoji + " " + EARNED[a.key].label).join(", ") + "." : ""));
      commit();
    },
    reset: () => { S = SEED(); Object.assign(U, { userMenu: false, pop: null, modal: null, endorse: null, chat: resetChat() }); toast("Demo reset."); commit(); },
  };

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (el && !el.disabled && ACTIONS[el.dataset.act]) { ACTIONS[el.dataset.act](el, ev); return; }
    let changed = false;
    if (U.pop && !ev.target.closest("[data-pop]")) { U.pop = null; changed = true; }
    if (U.userMenu && !ev.target.closest(".sb-foot")) { U.userMenu = false; changed = true; }
    if (U.taleLangOpen && !ev.target.closest(".tl-lang-wrap")) { U.taleLangOpen = false; changed = true; }
    if (changed) render();
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.id === "st-text") {
      U.modal.text = t.value;
      const saveBtn = document.getElementById("st-save");
      if (saveBtn) saveBtn.disabled = !(U.modal.emoji || t.value.trim());
    }
    if (t.id === "en-text") {
      U.endorse.text = t.value;
      document.getElementById("en-count").textContent = t.value.length + "/" + ENDORSE_MAX_CHARS;
      document.getElementById("en-save").disabled = t.value.trim().length < ENDORSE_MIN_CHARS;
    }
    if (t.id === "tl-reflection") S.tale.reflection = t.value;
    if (t.id === "chat-input") U.chat.draft = t.value;
  });
  document.addEventListener("change", (ev) => { if (ev.target.id === "st-expiry") U.modal.expiry = ev.target.value; });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (U.modal && U.modal.picker) U.modal.picker = false;
      else if (U.endorse && U.endorse.picker) U.endorse.picker = false;
      else if (U.modal) U.modal = null;
      else if (U.endorse) U.endorse = null;
      else if (U.unlock) U.unlock = null;
      else if (U.sessionChange) U.sessionChange = null;
      else if (U.xpModal) U.xpModal = null;
      else if (U.trivia) U.trivia = null;
      else if (U.taleLangOpen) U.taleLangOpen = false;
      else if (U.pop) U.pop = null;
      else if (U.userMenu) U.userMenu = false;
      else return;
      render();
    }
    if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "chat-input") { ev.preventDefault(); send(); }
    if (ev.key === "Enter" && ev.target.id === "st-text") { ev.preventDefault(); ACTIONS.saveStatus(); }
    if (ev.key === "Enter" && ev.target.id === "en-text") { ev.preventDefault(); ACTIONS.saveEndorse(); }
  });
  window.addEventListener("resize", () => { if (U.pop) { U.pop = null; render(); } });

  render();
})();
</script>
</body>
</html>
